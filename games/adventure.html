<style>
*{box-sizing:border-box}

@keyframes zt{0%{opacity:0;transform:translate(-50%,20px)}15%{opacity:1;transform:translate(-50%,0)}80%{opacity:1}100%{opacity:0}}

.pop.out{animation:popout .2s ease-in forwards}

.pop .bar{display:flex;align-items:center;justify-content:space-between;padding:5px 10px 5px 16px;font-size:16px}
.pop .realx{font-family:inherit;border:2px solid #ffffffaa;background:#ffffff33;color:inherit;font-size:18px;font-weight:600;cursor:pointer;padding:2px 12px;border-radius:10px}
.pop.tiny .realx{font-size:13px;padding:0 5px;opacity:.7}

.bait{margin-top:10px;font-family:inherit;font-size:28px;font-weight:800;color:#fff;border:5px solid #fff;border-radius:18px;padding:6px 28px;background:linear-gradient(#4ade80,#16a34a);box-shadow:0 7px 0 #14532d;cursor:pointer;animation:pulse .8s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.07)}}
.pop.tiny .toast{position:absolute;z-index:30;font-size:28px;font-weight:800;padding:8px 22px;border-radius:18px;pointer-events:none;animation:fly 1.4s ease-out forwards;white-space:nowrap}
.toast.good{background:#16a34a;color:#fff}.toast.bad{background:#dc2626;color:#fff}
@keyframes fly{0%{transform:translate(-50%,0) scale(.6);opacity:0}15%{transform:translate(-50%,-10px) scale(1.05);opacity:1}100%{transform:translate(-50%,-90px);opacity:0}}
.shake{animation:shake .35s}

.chest{font-size:90px;line-height:1;animation:wig 1s ease-in-out infinite}
.hide{display:none!important}

let world = [], camX = 0, hero, zoneIdx = 0, hearts = 5, coins = 0, closed = 0, fooled = 0, fooledBy = [0, 0, 0], state = 'title', easy = false, lastT = 0, spawnT = 0, inv = 0, raf = 0, bag = [], zoneShown = -1, coinsAtZone = 0;

  world = [];

}
function resetHero(){ hero = { y: GROUND, vy: 0, onGround: true, run: 0 }; }
function zoneOf(x){ return Math.max(0, Math.min(2, Math.floor(x / ZLEN))); }

// ---------- drawing ----------
function drawBG(z){
  const W = 1600;
  if (z === 0) {
    const sky = g.createLinearGradient(0, 0, 0, GROUND); sky.addColorStop(0, '#7dd3fc'); sky.addColorStop(1, '#bae6fd'); g.fillStyle = sky; g.fillRect(0, 0, W, 900);
    g.fillStyle = '#fde047'; g.beginPath(); g.arc(180, 190, 70, 0, 7); g.fill();
    g.fillStyle = '#fff'; for (let i = 0; i < 4; i++) { const cx = ((i * 520 - camX * .1) % 2100 + 2100) % 2100 - 250; g.beginPath(); g.ellipse(cx, 200 + (i % 2) * 70, 140, 40, 0, 0, 7); g.fill(); }
    hills('#4ade80', .3, 330, 260); hills('#22c55e', .5, 260, 200);
    for (let i = 0; i < 6; i++) { const tx = ((i * 330 - camX * .7) % 1980 + 1980) % 1980 - 150; g.fillStyle = '#92400e'; g.fillRect(tx + 52, GROUND - 120, 26, 120); g.fillStyle = '#15803d'; g.beginPath(); g.arc(tx + 65, GROUND - 150, 70, 0, 7); g.fill(); }
    ground('#d6a85a', '#b7843a');
  } else if (z === 1) {
    g.fillStyle = '#2e1065'; g.fillRect(0, 0, W, 900);
    g.fillStyle = '#4c1d95'; for (let i = 0; i < 14; i++) { const sx = ((i * 140 - camX * .4) % 1960 + 1960) % 1960 - 180; g.beginPath(); g.moveTo(sx, 90); g.lineTo(sx + 50, 90); g.lineTo(sx + 25, 90 + 60 + (i % 3) * 40); g.fill(); }
    g.fillStyle = '#a78bfa55'; for (let i = 0; i < 8; i++) { const cx = ((i * 260 - camX * .6) % 2080 + 2080) % 2080 - 240; g.beginPath(); g.moveTo(cx, GROUND); g.lineTo(cx + 30, GROUND - 80); g.lineTo(cx + 60, GROUND); g.fill(); }
    hills('#3b0764', .5, 220, 160);
    ground('#57534e', '#44403c');
  } else {
    const sky = g.createLinearGradient(0, 0, 0, GROUND); sky.addColorStop(0, '#fb923c'); sky.addColorStop(1, '#fde68a'); g.fillStyle = sky; g.fillRect(0, 0, W, 900);
    g.fillStyle = '#7c2d12aa'; for (let i = 0; i < 5; i++) { const bx = ((i * 420 - camX * .3) % 2100 + 2100) % 2100 - 250; g.fillRect(bx, 330, 120, GROUND - 330); for (let k = 0; k < 4; k++) g.fillRect(bx + k * 32, 300, 22, 30); }
    ground('#a8a29e', '#78716c');
  }
}
function hills(col, par, h, amp){ g.fillStyle = col; g.beginPath(); g.moveTo(0, GROUND); for (let x = 0; x <= 1600; x += 20) g.lineTo(x, GROUND - h + Math.sin((x + camX * par) / 260) * amp * .3 - amp * .2); g.lineTo(1600, GROUND); g.fill(); }
function ground(c1, c2){ g.fillStyle = c2; g.fillRect(0, GROUND, 1600, 12); g.fillStyle = c1; g.fillRect(0, GROUND + 12, 1600, 900 - GROUND); g.fillStyle = c2; for (let x = -((camX) % 80); x < 1600; x += 80) g.fillRect(x, GROUND + 40, 40, 8); }
function drawOb(o){
  const sx = o.x - camX + HX; if (sx < -100 || sx > 1700) return;
  const z = o.z;
  if (z === 1) { g.fillStyle = '#c4b5fd'; g.beginPath(); g.moveTo(sx, GROUND); g.lineTo(sx + o.w / 2, GROUND - o.h - 10); g.lineTo(sx + o.w, GROUND); g.fill(); g.fillStyle = '#8b5cf6'; g.beginPath(); g.moveTo(sx + o.w / 2, GROUND); g.lineTo(sx + o.w / 2, GROUND - o.h - 10); g.lineTo(sx + o.w, GROUND); g.fill(); return; }
  if (z === 2) { g.fillStyle = '#92400e'; g.fillRect(sx, GROUND - o.h, o.w, o.h); g.fillStyle = '#78350f'; g.fillRect(sx, GROUND - o.h + 10, o.w, 6); g.fillRect(sx, GROUND - 16, o.w, 6); return; }
  if (o.kind === 'rock') { g.fillStyle = '#6b7280'; g.beginPath(); g.ellipse(sx + o.w / 2, GROUND - o.h / 2, o.w / 2 + 6, o.h / 2 + 2, 0, 0, 7); g.fill(); g.fillStyle = '#9ca3af'; g.beginPath(); g.ellipse(sx + o.w / 2 - 10, GROUND - o.h / 2 - 8, 14, 8, 0, 0, 7); g.fill(); }
  else { g.fillStyle = '#92400e'; g.fillRect(sx, GROUND - o.h, o.w, o.h); g.fillStyle = '#d6a85a'; g.beginPath(); g.ellipse(sx + o.w / 2, GROUND - o.h, o.w / 2, 10, 0, 0, 7); g.fill(); g.strokeStyle = '#92400e'; g.beginPath(); g.ellipse(sx + o.w / 2, GROUND - o.h, o.w / 4, 5, 0, 0, 7); g.stroke(); }
}
function drawCoin(c, t){ const sx = c.x - camX + HX; if (sx < -60 || sx > 1660) return; const w = Math.abs(Math.cos(t / 250 + c.x)) * 22 + 4;
  g.fillStyle = '#ca8a04'; g.beginPath(); g.ellipse(sx, c.y, w + 4, 26, 0, 0, 7); g.fill(); g.fillStyle = '#facc15'; g.beginPath(); g.ellipse(sx, c.y, w, 22, 0, 0, 7); g.fill(); }
function drawCastle(){ const end = 3 * ZLEN, sx = end - camX + HX; if (sx > 1800) return;
  g.fillStyle = '#e7e5e4'; g.fillRect(sx, GROUND - 330, 360, 330); for (let k = 0; k < 6; k++) g.fillRect(sx + k * 64, GROUND - 370, 40, 40);
  g.fillStyle = '#78350f'; g.beginPath(); g.moveTo(sx + 130, GROUND); g.lineTo(sx + 130, GROUND - 130); g.arc(sx + 180, GROUND - 130, 50, Math.PI, 0); g.lineTo(sx + 230, GROUND); g.fill();
  g.fillStyle = '#dc2626'; g.beginPath(); g.moveTo(sx + 180, GROUND - 470); g.lineTo(sx + 250, GROUND - 445); g.lineTo(sx + 180, GROUND - 420); g.fill(); g.fillStyle = '#57534e'; g.fillRect(sx + 176, GROUND - 470, 6, 100); }
function drawHero(t){
  const x = HX, y = hero.y, blink = inv > 0 && Math.floor(t / 100) % 2;
  if (blink) return;
  const leg = hero.onGround && state === 'play' && !paused() ? Math.sin(hero.run * 18) * 14 : 6;
  g.fillStyle = '#1e3a8a'; g.fillRect(x - 22 + leg / 2, y - 34, 16, 34); g.fillRect(x + 6 - leg / 2, y - 34, 16, 34);
  g.fillStyle = '#3b82f6'; roundRect(x - 34, y - 104, 68, 74, 18);
  g.fillStyle = '#fcd9b8'; g.beginPath(); g.arc(x, y - 138, 42, 0, 7); g.fill(); g.strokeStyle = '#7c2d12'; g.lineWidth = 5; g.stroke();
  g.fillStyle = '#1f2937'; g.beginPath(); g.ellipse(x - 12, y - 140, 5, 7, 0, 0, 7); g.ellipse(x + 16, y - 140, 5, 7, 0, 0, 7); g.fill();
  g.fillStyle = '#ef4444'; g.beginPath(); g.arc(x, y - 150, 46, Math.PI, 0); g.fill(); g.fillRect(x, y - 156, 60, 12);
}
function roundRect(x, y, w, h, r){ g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.fill(); }

// ---------- popups ----------
const openPops = () => [...layer.children].filter(p => !p._done).length;
const blocked = () => openPops() > 0 || (spawn._pending > 0);
const paused = () => blocked() || resumeT > 0;
function pick(){ if (!bag.length) bag = [...TRICKS, ...SAFES, ...SAFES].map(x => ({ x, k: x.s ? 't' : 's' })).sort(() => Math.random() - .5); return bag.pop(); }
function freeSpot(){
  for (let i = 0; i < 30; i++) { const x = 380 + Math.random() * (1600 - 380 - 450 - 180), y = 100 + Math.random() * 360;
    if (![...layer.children].some(p => Math.abs(p.offsetLeft - x) < 400 && Math.abs(p.offsetTop - y) < 240)) return [x, y]; }
  return [380 + Math.random() * 600, 100 + Math.random() * 360];
}
function toast(x, y, txt, good){ const d = document.createElement('div'); d.className = 'toast ' + (good ? 'good' : 'bad'); d.textContent = txt; d.style.left = Math.min(1600 - 320, Math.max(320, x)) + 'px'; d.style.top = Math.max(100, y) + 'px'; stage.appendChild(d); setTimeout(() => d.remove(), 1400); }
function removePop(p){ p._done = true; p.classList.add('out'); setTimeout(() => p.remove(), 200); }
function hud(){
  $('#hearts').textContent = '❤️'.repeat(Math.max(0, hearts)) + '🤍'.repeat(Math.max(0, maxHearts - hearts)); $('#coins').textContent = '🪙 ' + coins;
  const p = Math.min(1, camX / (3 * ZLEN)); $('#pfill').style.width = (p * 100) + '%'; $('#pme').style.left = (p * 96 + 2) + '%';
}
function hurt(){ hearts--; inv = 1.2; sBad(); cv.classList.remove('shake'); void cv.offsetWidth; cv.classList.add('shake'); hud(); if (hearts <= 0) lose(); }
function popHit(p, good, msg, gain = 5){
  if (state !== 'play' || p._done) return;
  const cx = p.offsetLeft + 210, cy = p.offsetTop + 50; removePop(p);
  if (good) { coins += gain; closed++; sGood(); toast(cx, cy, msg, true); hud(); return; }
  fooled++; (p._signs || []).forEach(s => fooledBy[s]++);
  toast(cx, cy, msg + (p._signs ? ' ' + T(SIGNS[p._signs[0]]) : ''), false); hurt();
  if (state === 'play') { spawn._pending = (spawn._pending || 0) + 2; setTimeout(() => { if (state !== 'play') { spawn._pending = 0; return; } toast(800, 420, UI[L].more, false); spawn(true); spawn(true); }, 500); }
}
function spawn(forceTrick){
  const U = UI[L], z = ZONES[zoneIdx]; let it = pick(); if (forceTrick && it.k !== 't') it = { k: 't', x: TRICKS[Math.floor(Math.random() * TRICKS.length)] };
  const p = document.createElement('div'), [x, y] = freeSpot(); p.style.left = x + 'px'; p.style.top = y + 'px';
  // ทุกป๊อปอัปมี 2 ปุ่มเหมือนกัน: [ปุ่มตามข้อความ] กับ [✕ ปิด] · หลอก = ต้องปิด · ของเกม = กดปุ่มได้ (+5) หรือปิดเฉย ๆ
  const t = it.x, trick = it.k === 't';
  p.className = 'pop gp c' + Math.floor(Math.random() * 4) + (Math.random() < z.tiny + M.tinyAdd ? ' tiny' : '');
  if (trick) p._signs = t.s;
  p.innerHTML = `<div class="bar"><span>🎮</span><button class="realx">${U.close}</button></div>
    <div class="content"><div class="ic">${t.ic}</div><h3>${T(t.h)}</h3><button class="bait">${T(t.b)}</button></div>`;
  p.querySelector('.bait').onclick = e => { e.stopPropagation(); trick ? popHit(p, false, U.fooled) : popHit(p, true, U.okd); };
  p.querySelector('.realx').onclick = e => { e.stopPropagation(); trick ? popHit(p, true, U.closed) : popHit(p, true, U.shut, 0); };
  p.addEventListener('pointerdown', e => e.stopPropagation());
  layer.appendChild(p); sPop(); if (spawn._pending > 0) spawn._pending--;
}

// ---------- loop ----------
function jump(){ if (state !== 'play' || !hero.onGround) return; hero.vy = JV; hero.onGround = false; sJump(); }
function step(now){
  if (state !== 'play') return;
  const dt = Math.max(0, Math.min(.05, (now - lastT) / 1000)); lastT = Math.max(lastT, now);
  if (inv > 0) inv -= dt;
  const z = zoneOf(camX);
  if (z !== zoneShown) { zoneShown = z; zoneIdx = z; coinsAtZone = coins; const d = document.createElement('div'); d.className = 'zoneTag'; d.textContent = T(ZONES[z].name); stage.appendChild(d); setTimeout(() => d.remove(), 2400); }
  const pz = blocked();
  if (pz) { wasPaused = true; $('#dim').classList.remove('hide'); $('#ready').classList.add('hide'); render(now); hud(); raf = requestAnimationFrame(step); return; }
  if (wasPaused) { wasPaused = false; resumeT = 1.1; $('#dim').classList.add('hide'); }
  if (resumeT > 0) { resumeT -= dt; const r = $('#ready'); r.classList.remove('hide'); r.textContent = resumeT > .4 ? UI[L].ready : UI[L].go; if (resumeT <= 0) r.classList.add('hide'); render(now); hud(); raf = requestAnimationFrame(step); return; }
  camX += SPEED * dt; hero.run += dt;
  // easy mode: auto jump
  if (M.auto && hero.onGround) { const ahead = world.find(o => o.t === 'ob' && !o.gone && Math.abs(o.x - camX - (SPEED * .48 - 23)) < 22); if (ahead) jump(); }
  hero.vy += GRAV * dt; hero.y += hero.vy * dt; if (hero.y >= GROUND) { hero.y = GROUND; hero.vy = 0; hero.onGround = true; }
  // collisions (hero box x: camX-30..camX+30)
  for (const o of world) {
    if (o.gone) continue;
    const rel = o.x - camX;
    if (o.t === 'ob' && rel < 28 && rel + o.w > -28 && hero.y > GROUND - o.h + 6) { o.gone = true; if (inv <= 0) { toast(HX + 60, GROUND - 260, UI[L].ouch, false); hurt(); if (state !== 'play') return; } }
    if (o.t === 'coin' && Math.abs(rel) < 40 && Math.abs((hero.y - 80) - o.y) < 90) { o.gone = true; coins++; sCoin(); }
  }
  // popups keep coming (no time limit on each one)
  // popup event: game pauses; only when hero is on the ground and nothing is right in front
  spawnT -= dt;
  if (spawnT <= 0 && hero.onGround && camX < 3 * ZLEN - 300 && !world.some(o => o.t === 'ob' && !o.gone && o.x - camX > -60 && o.x - camX < 260)) {
    const n = M.burst[0] + Math.floor(Math.random() * (M.burst[1] - M.burst[0] + 1));
    for (let i = 0; i < n; i++) setTimeout(() => { if (state === 'play') spawn(); }, i * 350);
    spawn._pending = n; wasPaused = true;
    spawnT = ZONES[zoneIdx].gap * M.gapMul * (.8 + Math.random() * .4);
  }
  if (camX >= 3 * ZLEN + 120) return win();
  render(now); hud();
  raf = requestAnimationFrame(step);
}
function render(now){
  drawBG(zoneOf(camX)); drawCastle();
  for (const o of world) if (!o.gone) o.t === 'ob' ? drawOb(o) : drawCoin(o, now);
  drawHero(now);
  if (blocked() && state === 'play') { g.fillStyle = '#000a'; g.font = '800 34px Kanit, Tahoma'; g.textAlign = 'center'; roundRect(HX - 170, hero.y - 260, 340, 56, 20); g.fillStyle = '#fff'; g.fillText(UI[L].wait, HX, hero.y - 220); }
}
function startZone(z, keepStats){
  layer.innerHTML = ''; cancelAnimationFrame(raf);
  if (!keepStats) { coins = 0; closed = 0; fooled = 0; fooledBy = [0, 0, 0]; buildWorld(); }
  else { coins = coinsAtZone; world.forEach(o => { if (o.z >= z) o.gone = false; }); }
  hearts = maxHearts; camX = z * ZLEN; zoneShown = -1; zoneIdx = z; resetHero(); inv = 0; bag = []; spawnT = 2.5; resumeT = 0; wasPaused = false; spawn._pending = 0; $('#dim').classList.add('hide'); $('#ready').classList.add('hide');
  $('#title').classList.add('hide'); $('#end').classList.add('hide');
  state = 'play'; lastT = performance.now(); hud(); raf = requestAnimationFrame(step);
}
function lose(){ $('#dim').classList.add('hide'); $('#ready').classList.add('hide'); state = 'lose'; cancelAnimationFrame(raf); setTimeout(() => showEnd(false), 600); }
function win(){ $('#dim').classList.add('hide'); state = 'win'; cancelAnimationFrame(raf); [...layer.children].forEach(removePop); sWin(); render(performance.now()); setTimeout(() => showEnd(true), 700); }
function showEnd(won){
  const U = UI[L]; $('#end').classList.remove('hide');
  $('#eChest').textContent = won ? '💰' : '💔'; $('#eTitle').textContent = won ? U.win : U.lose;
  $('#eCoins').textContent = coins; $('#eClosed').textContent = closed; $('#eFooled').textContent = fooled;
  $('#lCoins').textContent = U.lCoins; $('#lClosed').textContent = U.lClosed; $('#lFooled').textContent = U.lFooled;
  const mx = Math.max(...fooledBy); $('#eMost').innerHTML = mx ? `${U.most} <b>${T(SIGNS[fooledBy.indexOf(mx)])}</b>` : U.noFool;
  $('#eSigns').innerHTML = `<b>${U.signs}</b> ${SIGNS.map(T).join(' · ')}`;
  $('#retry').textContent = U.retry; $('#again').textContent = U.again; $('#retry').classList.toggle('hide', won);
}
function applyLang(){
  const U = UI[L]; document.documentElement.lang = L; document.title = U.title;
  $('#lth').classList.toggle('on', L === 'th'); $('#len').classList.toggle('on', L === 'en');
  $('#tTitle').textContent = U.title; $('#tSub').textContent = U.sub; ['0', '1', '2', '3'].forEach(k => $('#rule' + k).innerHTML = U['r' + k]);
  $('#gback').textContent = U.gback; $('#goN').innerHTML = U.goN; $('#goE').innerHTML = U.goE; $('#goH').innerHTML = U.goH; $('#jump').innerHTML = U.jump;
  if (state === 'win' || state === 'lose') showEnd(state === 'win');
}
$('#lth').onclick = () => { L = 'th'; applyLang(); }; $('#len').onclick = () => { L = 'en'; applyLang(); };
$('#snd').onclick = () => { sound = !sound; $('#snd').textContent = sound ? '🔊' : '🔇'; };
function go(m){ M = MODES[m]; SPEED = M.speed; maxHearts = M.hearts; easy = M.auto; $('#jump').classList.toggle('hide', M.auto); startZone(0, false); }
$('#goN').onclick = () => go('normal'); $('#goE').onclick = () => go('easy'); $('#goH').onclick = () => go('hard');
$('#retry').onclick = () => startZone(zoneIdx, true);
function toTitle(){ cancelAnimationFrame(raf); $('#dim').classList.add('hide'); $('#ready').classList.add('hide'); $('#end').classList.add('hide'); $('#title').classList.remove('hide'); state = 'title'; layer.innerHTML = ''; spawn._pending = 0; camX = 0; resetHero(); render(performance.now()); hud(); }
const EMB = window.parent !== window;
if (EMB) { $('#gback').classList.remove('hide'); $('#gback').onclick = () => { toTitle(); parent.postMessage('closeGame', '*'); }; }
addEventListener('message', e => { if (e.data && e.data.lang) { L = e.data.lang === 'en' ? 'en' : 'th'; applyLang(); } });
$('#again').onclick = () => { $('#dim').classList.add('hide'); $('#end').classList.add('hide'); $('#title').classList.remove('hide'); state = 'title'; layer.innerHTML = ''; camX = 0; resetHero(); render(performance.now()); };
$('#jump').addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); jump(); });
cv.addEventListener('pointerdown', () => jump());
addEventListener('keydown', e => { if (e.code === 'Space' || e.code === 'ArrowUp') { e.preventDefault(); if (document.activeElement && document.activeElement.blur) document.activeElement.blur(); jump(); } });
document.addEventListener('click', () => { if (state === 'play' && document.activeElement && document.activeElement.blur) document.activeElement.blur(); });
buildWorld(); resetHero(); applyLang(); hud(); render(0);
</script>
</body></html>
