<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ฮีโร่กลุ่มแชท</title>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#0b2545;--navy2:#13315c;--sel:#facc15;--act:#0284c7;--ok:#16a34a;--bad:#dc2626;--ink:#0f172a;--muted:#475569;--line:#cbd5e1}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--navy);color:#fff;font-family:Kanit,Tahoma,sans-serif}
button{font-family:inherit;cursor:pointer;border:none;border-radius:14px;min-height:48px;font-size:20px;font-weight:600;padding:6px 20px;background:var(--act);color:#fff;box-shadow:0 4px 0 #0005}
button:disabled{background:#94a3b8;color:#1e293b;box-shadow:none;cursor:not-allowed}
.hide{display:none!important}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px;flex-wrap:wrap}
.ctls{display:flex;gap:8px;margin-left:auto}
.ctl{background:var(--navy2);border:2px solid #ffffff55;box-shadow:none;font-size:17px;min-height:44px;padding:4px 14px}
.ctl.on{background:#fff;color:var(--navy)}
.hud{display:flex;gap:10px;flex-wrap:wrap;font-size:18px}
.hud span{background:var(--navy2);border-radius:20px;padding:4px 14px}
.wrap{max-width:1040px;margin:0 auto;padding:4px 16px 32px}
.title{text-align:center;display:flex;flex-direction:column;align-items:center;gap:16px;padding-top:24px}
.badge{font-size:84px;line-height:1}
.title h1{margin:0;font-size:52px;font-weight:800}
.title p{margin:0;font-size:21px;color:#bfdbfe;max-width:680px}
#goN{font-size:26px;padding:14px 40px}
.play{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:20px;align-items:start}
/* แชทกลุ่ม */
.chat{background:#1e293b;border-radius:24px;overflow:hidden;box-shadow:0 10px 0 #020617;display:flex;flex-direction:column;height:620px;cursor:pointer}
.chathd{background:#0f172a;display:flex;align-items:center;gap:10px;padding:10px 16px}
.chathd .gav{width:42px;height:42px;border-radius:50%;background:#4f46e5;display:flex;align-items:center;justify-content:center;font-size:22px}
.chathd b{display:block;font-size:18px}.chathd small{color:#94a3b8;font-size:14px}
.lines{flex:1;overflow-y:auto;padding:14px 14px 18px;display:flex;flex-direction:column;gap:10px}
.ln{display:flex;gap:8px;align-items:flex-end;max-width:86%}
.ln .av{flex:none;width:34px;height:34px;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px}
.ln .who{color:#93c5fd;font-size:13px;margin-bottom:2px}
.bub{background:#fff;color:var(--ink);border-radius:16px 16px 16px 4px;padding:8px 14px;font-size:18px;line-height:1.35;position:relative}
.bub .rx{position:absolute;right:-6px;bottom:-14px;background:#fff;border:2px solid #1e293b;border-radius:12px;font-size:13px;padding:0 6px;color:var(--ink)}
.stk{font-size:56px;line-height:1;padding:4px 6px;background:transparent}
.photo{display:flex;flex-direction:column;gap:6px}
.photo .pic{width:220px;height:130px;border-radius:12px;background:linear-gradient(135deg,#fde68a,#fca5a5);display:flex;align-items:center;justify-content:center;font-size:54px}
.poll{display:flex;flex-direction:column;gap:6px;min-width:220px}
.poll span{display:flex;justify-content:space-between;background:#e0f2fe;border-radius:10px;padding:3px 10px;font-size:16px}
.ln.me{align-self:flex-end;flex-direction:row-reverse}
.ln.me .bub{background:#0284c7;color:#fff;border-radius:16px 16px 4px 16px}
.ln.dm .bub{background:#dcfce7;color:#14532d;border:2px dashed #16a34a}
.ln.dm .who{color:#86efac}
.sys{align-self:center;background:#334155;color:#cbd5e1;border-radius:14px;padding:3px 14px;font-size:14px;text-align:center;max-width:92%}
.typing .bub{display:flex;gap:5px;align-items:center;padding:12px 16px}
.typing i{width:9px;height:9px;border-radius:50%;background:#64748b;animation:dot 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
.skip{color:#64748b;font-size:14px;text-align:center;padding:4px 0 8px}
/* แผงขวา */
.side{display:flex;flex-direction:column;gap:14px}
.card{background:#fff;color:var(--ink);border-radius:24px;padding:20px;display:flex;flex-direction:column;gap:12px;box-shadow:0 10px 0 #020617}
.heart{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:center}
.face{grid-row:1/3;font-size:54px;line-height:1}
.heart b{font-size:19px}
.hbar{height:20px;border-radius:12px;background:#e2e8f0;overflow:hidden;position:relative}
.hbar i{display:block;height:100%;border-radius:12px;background:linear-gradient(90deg,#f472b6,#e11d48);transition:width .6s}
.delta{font-weight:800;font-size:18px}.delta.up{color:var(--ok)}.delta.dn{color:var(--bad)}
.ask{font-size:21px;font-weight:600;margin:0}
.opts{display:flex;flex-direction:column;gap:9px}
.op{background:#f8fafc;color:var(--ink);border:3px solid var(--line);box-shadow:0 3px 0 var(--line);font-size:18px;text-align:left;font-weight:400;line-height:1.35;padding:8px 14px}
.op:disabled{cursor:default;color:var(--ink);background:#f8fafc}
.op.picked{border-color:var(--act);box-shadow:0 3px 0 var(--act);background:#e0f2fe}
.res{border-radius:14px;padding:12px 16px;font-size:18px;line-height:1.45}
.res.good{background:#dcfce7;color:#14532d}.res.no{background:#fee2e2;color:#7f1d1d}
.go{align-self:flex-end}
.final{text-align:center;align-items:center}
.final .badge{font-size:100px}
.final h2{margin:0;font-size:36px}
.final p{margin:0;font-size:21px;color:var(--muted)}
.list{display:flex;flex-direction:column;gap:8px;width:100%;text-align:left}
.list div{background:#f8fafc;border-radius:12px;padding:8px 12px;font-size:17px;display:flex;justify-content:space-between;gap:10px}
.btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.pop{animation:pop .35s ease-out both}
@keyframes dot{0%,60%,100%{transform:translateY(0);opacity:.5}30%{transform:translateY(-6px);opacity:1}}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.9)}to{opacity:1;transform:none}}
@keyframes beat{0%,100%{transform:scale(1)}40%{transform:scale(1.25)}}
.beat{animation:beat .5s}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes blink{0%,60%,100%{opacity:.35}30%{opacity:1}}
/* ฉาก "1 สัปดาห์ต่อมา" + ตอนจบ */
.epi{display:flex;flex-direction:column;gap:12px;cursor:pointer}
.epi h2{margin:0;font-size:32px;text-align:center}
.ecards{display:flex;flex-direction:column;gap:10px}
.ecard{display:grid;grid-template-columns:64px 1fr;gap:14px;align-items:center;background:#f8fafc;border-radius:16px;padding:10px 16px;font-size:20px;line-height:1.4;border-left:8px solid var(--line)}
.ecard.g{border-color:var(--ok);background:#f0fdf4}.ecard.b{border-color:var(--bad);background:#fef2f2}
.ecard .em{font-size:44px;text-align:center;line-height:1}
.ending{border-radius:20px;padding:18px 20px;display:flex;flex-direction:column;gap:10px}
.ending h3{margin:0;font-size:28px;text-align:center}
.ending.good{background:linear-gradient(135deg,#fef9c3,#dcfce7)}.ending.mid{background:linear-gradient(135deg,#e0f2fe,#f1f5f9)}.ending.sad{background:linear-gradient(135deg,#cbd5e1,#94a3b8);color:#0f172a}
.ending .ecard{background:#ffffffb0;border-color:transparent}
#toSum{align-self:center}
@media (prefers-reduced-motion:reduce){.pop{animation-name:fade}.typing i{animation-name:blink}.beat{animation:none}.hbar i{transition:none}}
@media (max-width:820px){.play{grid-template-columns:1fr}.chat{height:480px}.title h1{font-size:38px}}
</style></head><body>
<div class="top">
 <div class="hud hide" id="hud"><span id="hRound"></span></div>
 <div class="ctls"><button class="ctl hide" id="gback"></button><button class="ctl on" id="lth">TH</button><button class="ctl" id="len">EN</button></div>
</div>
<div class="wrap">
 <section id="sTitle" class="title">
  <div class="badge">💬🦸</div>
  <h1 id="tTitle"></h1>
  <p id="tSub"></p>
  <button id="goN"></button>
 </section>
 <section id="sPlay" class="play hide">
  <div class="chat" id="chat">
   <div class="chathd"><span class="gav">😎</span><span><b id="cName"></b><small id="cMem"></small></span></div>
   <div class="lines" id="lines"></div><div class="skip" id="cSkip"></div>
  </div>
  <div class="side">
   <div class="card">
    <div class="heart"><span class="face" id="face"></span><b id="hLbl"></b><div class="hbar"><i id="hFill"></i></div></div>
    <span class="delta hide" id="delta"></span>
   </div>
   <div class="card">
    <p class="ask" id="ask"></p>
    <div class="opts" id="opts"></div>
    <div class="res hide" id="res"></div>
    <button class="go hide" id="next"></button>
   </div>
  </div>
 </section>
 <section id="sEpi" class="card epi hide">
  <h2 id="epTitle"></h2>
  <div class="ecards" id="epCards"></div>
  <div class="ending hide" id="ending"><h3 id="enTitle"></h3><div class="ecards" id="enCards"></div></div>
  <div class="skip" id="epSkip"></div>
  <button id="toSum" class="hide"></button>
 </section>
 <section id="sEnd" class="card final hide">
  <div class="badge" id="eBadge"></div>
  <h2 id="eRank"></h2>
  <p id="eSum"></p>
  <div class="list" id="eList"></div>
  <div class="btns"><button id="eAgain"></button><button id="eTitle" class="ctl"></button></div>
 </section>
</div>
<script>
// เกมเล่นเฉย ๆ ไม่เก็บคะแนน · เราเป็นคนที่เห็นเพื่อน (ภูมิ) โดนแกล้งในกลุ่มแชทห้อง · เล่นรอบละ 5 เหตุการณ์ (สุ่มจาก 7) · ทุกเหตุการณ์เกมหยุดให้เลือกทำ 1 อย่าง จาก 6 ตัวเลือก (เฉพาะเหตุการณ์ 2 + ทั่วไป 4)
// จบแล้วมีฉาก "1 สัปดาห์ต่อมา" จากตัวเลือกที่เลือกจริง + ตอนจบ 3 แบบตามหัวใจของภูมิ
// ปุ่มตัวเลือกหน้าตาเหมือนกัน สลับลำดับทุกครั้ง · หลอดหัวใจของภูมิขึ้น/ลงตามสิ่งที่เราเลือก · แชทเปลี่ยนตาม
const $ = s => document.querySelector(s);
const P = { ta: { th: 'ต้า', en: 'Ta', c: '#c2410c' }, beam: { th: 'บีม', en: 'Beam', c: '#4f46e5' }, por: { th: 'ปอ', en: 'Por', c: '#0f766e' },
            mint: { th: 'มิ้นท์', en: 'Mint', c: '#be185d' }, june: { th: 'จูน', en: 'June', c: '#15803d' }, phum: { th: 'ภูมิ', en: 'Phum', c: '#0284c7' }, kru: { th: 'ครูแอน', en: 'Ms. Ann', c: '#334155' },
            fake: { th: 'ภูมิตัวจริง', en: 'RealPhum', c: '#64748b' }, mum: { th: 'แม่', en: 'Mum', c: '#9333ea' } };
// เหตุการณ์ 4 รอบ: k = text | stk (สติกเกอร์) | photo | poll | sys · rx = ปุ่มรีแอคชันใต้ข้อความ
const ROUNDS = [
  { by: 'ta', ask: { th: 'ภูมิโดนล้อด้วยสติกเกอร์ เราจะทำอะไร?', en: 'Phum is teased with a sticker. What will we do?' }, lines: [
    { p: 'ta', k: 'text', x: { th: 'เมื่อกี้ดูภูมิวิ่งตอนพละยัง 555', en: 'Did you see Phum running in PE lol' } },
    { p: 'ta', k: 'stk', x: '🐢💨', rx: '😂 5' },
    { p: 'beam', k: 'text', x: { th: '555 ช้าจริง', en: 'lol so slow' } },
    { p: 'phum', k: 'typing' }] },
  { by: 'beam', ask: { th: 'มีคนแชร์รูปที่ทำให้ภูมิอาย เราจะทำอะไร?', en: 'Someone shares a photo that embarrasses Phum. What will we do?' }, lines: [
    { p: 'beam', k: 'photo', pic: '🤸🍜', x: { th: 'ภาพหลุด ภูมิล้มในโรงอาหาร 555', en: 'Caught on camera: Phum fell in the canteen lol' }, rx: '😂 8' },
    { p: 'por', k: 'text', x: { th: 'ส่งไปกลุ่มห้อง 2 แล้ว', en: 'Sent it to Class 2’s group' } },
    { p: 'phum', k: 'text', x: { th: 'ลบได้ไหม 😞', en: 'Can you delete it 😞' } }] },
  { by: 'ta', ask: { th: 'ต้าตั้งกลุ่มใหม่ ไม่ให้ภูมิเข้า เราจะทำอะไร?', en: 'Ta made a new group without Phum. What will we do?' }, lines: [
    { p: 'ta', k: 'text', x: { th: 'ไปคุยกลุ่มใหม่กัน ไม่ต้องชวนภูมินะ', en: 'Let’s move to a new group. Don’t add Phum' } },
    { k: 'sys', x: { th: 'ต้า สร้างกลุ่ม "ป.4/1 ตัวจริง" · เพิ่มสมาชิก 30 คน', en: 'Ta created "Y4/1 Real" · added 30 members' } },
    { p: 'mint', k: 'text', x: { th: 'โอเค 👌', en: 'OK 👌' } },
    { p: 'phum', k: 'text', x: { th: 'ทำไมเราไม่อยู่ในกลุ่มใหม่อะ', en: 'Why am I not in the new group?' } }] },
  { by: 'ta', ask: { th: 'มีโพลตั้งชื่อเล่นล้อภูมิ เราจะทำอะไร?', en: 'There is a poll to give Phum a mean nickname. What will we do?' }, lines: [
    { p: 'ta', k: 'poll', x: { th: '📊 โหวตชื่อเล่นใหม่ให้ภูมิ', en: '📊 Vote for Phum’s new nickname' }, o: [[{ th: '🐢 เต่าน้อย', en: '🐢 Little Turtle' }, 7], [{ th: '🥔 มันฝรั่ง', en: '🥔 Potato' }, 5]] },
    { p: 'june', k: 'text', x: { th: 'โหวตแล้ว 555', en: 'Voted lol' } },
    { p: 'phum', k: 'typing' }] },
  { by: 'fake', skip: ['talkta', 'fight', 'revenge'], ask: { th: 'มีบัญชีปลอมแอบอ้างเป็นภูมิ เราจะทำอะไร?', en: 'A fake account is pretending to be Phum. What will we do?' }, lines: [
    { k: 'sys', x: { th: 'บัญชี "ภูมิตัวจริง" เข้าร่วมกลุ่ม', en: '"RealPhum" joined the group' } },
    { p: 'fake', k: 'text', x: { th: 'เราชอบกินขี้มูกตอนเรียน 555', en: 'I like eating my boogers in class lol' } },
    { p: 'beam', k: 'text', x: { th: 'จริงดิ ภูมิ 😂', en: 'For real, Phum? 😂' }, rx: '😂 6' },
    { p: 'phum', k: 'text', x: { th: 'นั่นไม่ใช่เรา!! 😭', en: 'That’s not me!! 😭' } }] },
  { by: 'ta', ask: { th: 'ต้าชวนกันไล่ภูมิออกจากทีม และกดรีพอร์ตภูมิ เราจะทำอะไร?', en: 'Ta wants everyone to kick Phum off the team and report him. What will we do?' }, lines: [
    { k: 'sys', x: { th: '🎮 ห้องเกม: ทีมฟ้า 4/4', en: '🎮 Game room: Blue team 4/4' } },
    { p: 'ta', k: 'text', x: { th: 'ใครให้ภูมิเข้าทีม แพ้แน่', en: 'Whoever let Phum on the team, we’ll lose' } },
    { p: 'por', k: 'text', x: { th: 'เตะออกเลย', en: 'Kick him out' } },
    { p: 'ta', k: 'text', x: { th: 'ทุกคนกดรีพอร์ตภูมิกัน จะได้โดนแบน', en: 'Everyone report Phum so he gets banned' }, rx: '👍 4' },
    { p: 'phum', k: 'typing' }] },
  { by: 'mint', ask: { th: 'มีคนเอาหน้าภูมิไปตัดต่อเป็นตัวการ์ตูน เราจะทำอะไร?', en: 'Someone edited Phum’s face onto a cartoon. What will we do?' }, lines: [
    { p: 'mint', k: 'photo', pic: '🦛🙂', x: { th: 'ภูมิเวอร์ชันฮิปโป 555', en: 'Hippo Phum lol' }, rx: '😂 9' },
    { p: 'june', k: 'text', x: { th: 'แต่งเก่งอะ', en: 'Nice edit' } },
    { p: 'ta', k: 'text', x: { th: 'เอาไปทำสติกเกอร์เลย', en: 'Make it a sticker!' } },
    { p: 'phum', k: 'text', x: { th: 'ลบเถอะ ขอร้อง', en: 'Please delete it' } }] }
];
const PLAY = 5;   // เล่นรอบละ 5 เหตุการณ์ สุ่มจากทั้งหมด
// ตัวเลือกเฉพาะเหตุการณ์ [ช่วยได้, ไม่ช่วย] ตามลำดับ ROUNDS · af = การ์ดในฉาก "1 สัปดาห์ต่อมา"
const SP = [
  [{ id: 'cheer', h: 1, d: 15, t: { th: '💪 ส่งสติกเกอร์ให้กำลังใจภูมิในกลุ่ม', en: '💪 Send a cheer-up sticker to Phum in the group' },
     out: [{ me: 1, k: 'stk', x: '💪🙂' }, { p: 'june', x: { th: '💪 ด้วยคน', en: '💪 Me too' } }],
     why: { th: 'ทุกคนในกลุ่มเห็นว่ามีคนอยู่ข้างภูมิ คนอื่นก็กล้าทำตาม', en: 'Everyone sees someone is on Phum’s side, so others feel brave enough to join.' },
     af: { e: '💪', x: { th: 'ในกลุ่มแชท มีเพื่อนส่งสติกเกอร์ให้กำลังใจภูมิตามเราอีกหลายคน', en: 'Lots of friends followed us and sent Phum cheer-up stickers' } } },
   { id: 'turtle', h: 0, d: -15, t: { th: '🐢 ส่งสติกเกอร์เต่าอีกตัวให้ฮากว่าเดิม', en: '🐢 Send another turtle sticker to make it funnier' },
     out: [{ me: 1, k: 'stk', x: '🐢🐢' }, { p: 'ta', x: { th: '555 เข้าใจเล่น', en: 'lol nice one' } }],
     why: { th: 'ดูเหมือนแค่ขำ ๆ แต่เป็นการแกล้งเพิ่ม ภูมิเห็นว่าคนแกล้งเขามีมากขึ้น', en: 'It looks like a joke, but it is more bullying. Phum sees even more people teasing him.' },
     af: { e: '🐢', x: { th: 'สติกเกอร์เต่ากลายเป็นมุกประจำห้อง ทุกคนเรียกภูมิว่าเต่า', en: 'The turtle sticker became a class joke. Everyone calls Phum “turtle” now' } } }],
  [{ id: 'askdel', h: 1, d: 15, t: { th: '🙏 บอกบีมว่า "ลบรูปเถอะ ภูมิไม่ได้อนุญาต"', en: '🙏 Tell Beam: "Please delete it, Phum didn’t say yes"' },
     out: [{ me: 1, x: { th: 'บีม ลบรูปเถอะ ภูมิไม่ได้อนุญาต', en: 'Beam, please delete it. Phum didn’t say yes' } }, { p: 'beam', x: { th: 'โอเค ลบแล้ว ขอโทษนะภูมิ', en: 'OK, deleted. Sorry Phum' } }],

  $('#eSum').textContent = U().sum(good, n) + ` · ${face()} ❤️ ${heart}%`;
  $('#eList').innerHTML = hist.map(h => { const a = h; return `<div><span>${esc(t(ROUNDS[h.ev].ask))}<br><b>${esc(t(a.t))}</b></span><span>${a.h ? '💚' : '💔'}</span></div>`; }).join('');
  $('#eAgain').textContent = U().again; $('#eTitle').textContent = U().toTitle;
}
$('#eAgain').onclick = start;
function toTitle(){ seq++; skipTo = null; playing = false; show('sTitle'); $('#hud').classList.add('hide'); }
$('#eTitle').onclick = toTitle;
$('#goN').onclick = start;

function applyLang(){
  document.documentElement.lang = L;
  $('#lth').classList.toggle('on', L === 'th'); $('#len').classList.toggle('on', L === 'en');
  $('#tTitle').textContent = U().title; $('#tSub').textContent = U().sub; document.title = U().title;
  $('#goN').textContent = U().go; $('#gback').textContent = U().gback;
  if (!$('#sPlay').classList.contains('hide')) {
    paint(); render(); if ($('#ask').textContent) { $('#ask').textContent = t(ROUNDS[order[round]].ask); paintOpts(); }
    if (picked) { const a = opts.find(x => x.id === picked); $('#res').innerHTML = `<b>${a.h ? U().helped : U().hurt}</b><br>${esc(t(a.why))}`; }
  }
  if (!$('#sEnd').classList.contains('hide')) renderEnd();
  if (!$('#sEpi').classList.contains('hide')) paintEpi();
}
$('#lth').onclick = () => { L = 'th'; applyLang(); }; $('#len').onclick = () => { L = 'en'; applyLang(); };
// เปิดใน iframe (Hub/ใบงาน): ปุ่มกลับส่ง 'closeGame' · รับภาษาจาก postMessage({lang})
if (window.parent !== window) { $('#gback').classList.remove('hide'); $('#gback').onclick = () => { toTitle(); parent.postMessage('closeGame', '*'); }; }
addEventListener('message', e => { if (e.data && e.data.lang) { L = e.data.lang === 'en' ? 'en' : 'th'; applyLang(); } });
applyLang();
</script>
</body></html>
