<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>นักสืบภาพ</title>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#0b2545;--navy2:#13315c;--sel:#facc15;--act:#0284c7;--ok:#16a34a;--bad:#dc2626;--ink:#0f172a;--muted:#475569;--line:#cbd5e1}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--navy);color:#fff;font-family:Kanit,Tahoma,sans-serif}
body{display:flex;flex-direction:column}
button{font-family:inherit;cursor:pointer;border:none;border-radius:14px;min-height:48px;font-size:20px;font-weight:600;padding:6px 20px;background:var(--act);color:#fff;box-shadow:0 4px 0 #0005}
button:disabled{background:#94a3b8;color:#1e293b;box-shadow:none;cursor:not-allowed}
.hide{display:none!important}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 16px;flex:none;flex-wrap:wrap}
.ctls{display:flex;gap:8px;margin-left:auto}
.ctl{background:var(--navy2);border:2px solid #ffffff55;box-shadow:none;font-size:17px;min-height:44px;padding:4px 14px}
.ctl.on{background:#fff;color:var(--navy)}
.trail{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:17px}
.trail .lbl{background:var(--navy2);border-radius:20px;padding:4px 14px}
.trail i{font-style:normal;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;background:#ffffff1a;border:2px dashed #ffffff44}
.trail.many i{width:28px;height:28px;font-size:14px}
.trail i.c{box-shadow:0 0 0 3px var(--sel)}
.trail i.g{background:#dcfce7;border:2px solid #16a34a}.trail i.r{background:#fee2e2;border:2px solid #dc2626}.trail i.n{background:#e2e8f0;border:2px solid #94a3b8}
main{flex:1;min-height:0;display:flex;justify-content:center;padding:0 16px 14px}
.title{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center}
.badge{font-size:min(84px,12vh);line-height:1}
.title h1{margin:0;font-size:min(52px,8vh);font-weight:800}
.title p{margin:0;font-size:21px;color:#bfdbfe;max-width:660px}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(240px,100%),1fr));gap:14px;width:100%;max-width:560px}
.modes button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:14px;font-size:26px}
.modes small{font-size:16px;font-weight:400;opacity:.9}
#goE{background:var(--ok)}#goH{background:#c2410c}#goX{background:#7c3aed;grid-column:1/-1}
.trail .hud{background:#fff;color:var(--ink);border-radius:20px;padding:4px 12px;font-weight:600;display:flex;gap:8px;align-items:center}
.trail .hud .low{color:var(--bad)}
.trail i.t{background:#fef3c7;border:2px solid #d97706}
.fb.t{background:#fef3c7}
/* เล่น: มือถือซ้าย · กล่องตัดสินใจขวา */
.play{flex:1;min-height:0;width:100%;max-width:1100px;display:grid;grid-template-columns:minmax(300px,400px) 1fr;gap:22px}
.phone{background:#020617;border-radius:40px;padding:12px;box-shadow:0 10px 0 #020617aa;min-height:0;display:flex}
.screen{flex:1;background:#f1f5f9;color:var(--ink);border-radius:30px;overflow:hidden;display:flex;flex-direction:column;min-height:0}
.sbar{display:flex;justify-content:space-between;padding:8px 22px 4px;font-size:14px;font-weight:600;background:#fff}
.apphd{display:flex;align-items:center;gap:10px;padding:6px 14px;background:#fff;border-bottom:1px solid var(--line);font-weight:800;font-size:18px}
.feed{flex:1;min-height:0;padding:10px;display:flex;flex-direction:column}
.post{background:#fff;border-radius:18px;box-shadow:0 2px 6px #0f172a1a;overflow:hidden;display:flex;flex-direction:column;min-height:0;animation:slide .45s ease-out}
.phd{display:flex;align-items:center;gap:8px;padding:10px 12px 4px;font-size:15px}
.pav{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:19px;flex:none}
.phd b{display:block}.phd small{color:var(--muted)}
.cap{padding:2px 12px 8px;font-size:16px;line-height:1.4}
.pic{background:none;border:none;box-shadow:none;border-radius:0;padding:0;min-height:0;flex:1;display:flex;cursor:zoom-in;position:relative}
.pic svg{width:100%;height:100%;max-height:100%;display:block}
.pic .zm{position:absolute;right:8px;bottom:8px;background:#0f172acc;color:#fff;font-size:14px;border-radius:999px;padding:2px 10px}
.pft{display:flex;gap:14px;padding:6px 12px 10px;font-size:15px;color:var(--muted)}
.side{display:flex;flex-direction:column;gap:12px;min-height:0;justify-content:center}
.q{font-size:24px;font-weight:800}
.acts{display:grid;gap:10px}
.acts button{font-size:22px;text-align:left;padding:10px 18px}
#aShare{background:#2563eb}#aCheck{background:#7c3aed}#aSkip{background:#475569}
#aShare2{background:#2563eb}#aSkip2{background:#475569}
.src{background:#fff;color:var(--ink);border-radius:18px;padding:12px 16px;font-size:18px;line-height:1.45;animation:pop .35s ease-out}
.src b{color:#7c3aed}
.fb{border-radius:20px;padding:14px 18px;color:var(--ink);animation:pop .35s ease-out}
.fb.g{background:#dcfce7}.fb.r{background:#fee2e2}.fb.n{background:#f1f5f9}
.fb h3{margin:0 0 6px;font-size:24px}
.fb p{margin:0;font-size:18px;line-height:1.45}
.fb .clue{margin-top:8px;font-weight:600}
.chat{display:flex;flex-direction:column;gap:6px}
.msg{align-self:flex-start;background:#fff;color:var(--ink);border-radius:16px 16px 16px 4px;padding:6px 12px;font-size:16px;max-width:90%;animation:pop .3s ease-out backwards}
.msg b{color:#4f46e5;font-size:13px;display:block}
#nextP{background:var(--ok);align-self:flex-start}
#zoom{position:fixed;inset:0;background:#0f172ae6;z-index:9;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;cursor:zoom-out;padding:16px}
#zoom .zb{background:#fff;border-radius:18px;padding:10px;width:min(900px,100%);max-height:80vh;display:flex}
#zoom svg{width:100%;height:auto;max-height:calc(80vh - 20px)}
#zoom span{font-size:20px}
#zoom.pick{cursor:crosshair}#zoom.pick svg{cursor:crosshair}
.mk{fill:none;stroke:#e11d48;stroke-width:3.5}.mkd{fill:#e11d48}
.tru{fill:#facc1533;stroke:#facc15;stroke-width:3;stroke-dasharray:7 4}
.step{font-size:16px;font-weight:800;color:var(--sel);letter-spacing:.5px}
.hint{font-size:20px;line-height:1.45;color:#e0f2fe}
.mine{background:var(--navy2);border-radius:14px;padding:8px 14px;font-size:17px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.mine button{min-height:36px;font-size:16px;padding:2px 12px;background:transparent;border:2px solid #ffffff66;box-shadow:none}
#aZoom{background:#0891b2}#aNone{background:#475569}
.fb .found{margin-top:6px;font-weight:600}
.end{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;min-height:0}
.end h2{margin:0;font-size:36px}
.end .sum{font-size:21px;color:#bfdbfe}
.path{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr));gap:8px;width:100%;max-width:900px;overflow:auto;min-height:0}
.path div{display:flex;gap:8px;align-items:center;background:var(--navy2);border-radius:14px;padding:6px 10px;text-align:left;font-size:16px}
.path i{font-style:normal;font-size:20px}
.ebtns{display:flex;gap:10px}
#eTitle{background:var(--navy2);border:2px solid #ffffff66}
@keyframes slide{from{opacity:0;transform:translateY(30px)}}
@keyframes pop{from{opacity:0;transform:scale(.9)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
@media (max-width:820px){html,body{overflow:auto;height:auto}.play{grid-template-columns:1fr}.phone{height:70vh}}
</style>
</head><body>
<div class="top">
 <div class="trail hide" id="trail"></div>
 <div class="ctls"><button class="ctl hide" id="home"></button><button class="ctl hide" id="gback"></button><button class="ctl on" id="lth">TH</button><button class="ctl" id="len">EN</button></div>
</div>
<main>
 <section id="sTitle" class="title">
  <div class="badge">📱🔍</div>
  <h1 id="tTitle"></h1>
  <p id="tSub"></p>
  <div class="modes"><button id="goE"></button><button id="goH"></button><button id="goX"></button></div>
 </section>
 <section id="sPlay" class="play hide">
  <div class="phone"><div class="screen">
   <div class="sbar"><span>9:41</span><span>📶 🔋</span></div>
   <div class="apphd">📷 <span id="appName"></span></div>
   <div class="feed" id="feed"></div>
  </div></div>
  <div class="side" id="side"></div>
 </section>
 <section id="sEnd" class="end hide">
  <div class="badge" id="eBadge"></div>
  <h2 id="eRank"></h2>
  <div class="sum" id="eSum"></div>
  <div class="path" id="ePath"></div>
  <div class="ebtns"><button id="eAgain"></button><button id="eTitle"></button></div>
 </section>
</main>
<div id="zoom" class="hide"></div>
<script src="../worksheet/pics.js"></script>

const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  if (n === 'ch') deck = shuffle(POSTS.filter(p => p.ch));
  else {
    const pool = x ? POSTS : POSTS.filter(p => !p.ch), ok = shuffle(pool.filter(p => p.ok)), bad = shuffle(pool.filter(p => !p.ok)), h = Math.floor(n / 2);
    deck = shuffle(ok.slice(0, h).concat(bad.slice(0, n - h)));
  }
  cur = 0; marks = []; clues = []; seq++;
  show('sPlay'); $('#trail').classList.remove('hide'); deal();
}
// ภาพ + เครื่องหมาย: จุดที่เด็กแตะ (วงแดง) · หลังตัดสินใจ = กรอบเหลืองตรงเบาะแสจริง
function marked(p){
  let x = '';
  if (stage === 'fb') (p.spot || []).forEach(([a, b, w, h]) => { x += `<rect class="tru" x="${a}" y="${b}" width="${w}" height="${h}" rx="6"/>`; });
  if (pt && pt !== 'none') x += `<circle class="mk" cx="${pt.x}" cy="${pt.y}" r="10"/><circle class="mkd" cx="${pt.x}" cy="${pt.y}" r="2.5"/>`;
  return pic(p.pic).replace('</svg>', x + '</svg>');
}
const hit = (p, q) => q === 'none' ? !p.spot || !!p.none : !!q && (p.spot || []).some(([a, b, w, h]) => q.x >= a - 6 && q.x <= a + w + 6 && q.y >= b - 6 && q.y <= b + h + 6);
function paintTrail(){
  $('#trail').classList.toggle('many', deck.length > 10);
  const hud = chief && stage !== 'end' ? `<span class="hud">${'❤️'.repeat(Math.max(0, hearts))}${'🤍'.repeat(3 - Math.max(0, hearts))}` +
    (tick ? `<span class="${left <= 10 ? 'low' : ''}">⏱ ${left}</span>` : '') + '</span>' : '';
  $('#trail').innerHTML = `<span class="lbl">🕵️ ${U().trail}</span>` + hud + deck.map((p, i) => `<i class="${marks[i] || ''}${clues[i] ? ' c' : ''}">${marks[i] === 'g' ? '✓' : marks[i] === 'r' ? '!' : marks[i] === 'n' ? '–' : marks[i] === 't' ? '⏰' : ''}</i>`).join('');
}
function deal(){ stage = 'spot'; checked = false; last = null; pt = null; startTimer(); paint(); }
function paint(){
  const p = deck[cur], u = U();
  $('#appName').textContent = u.app;
  $('#feed').innerHTML = `<div class="post"><div class="phd"><span class="pav" style="background:${p.c}">${p.av}</span><span><b>${esc(T(p.who))}</b><small>${esc(T(p.tm))}</small></span></div>` +
    `<div class="cap">${esc(T(p.cap))}</div><button type="button" class="pic" id="pic">${marked(p)}<span class="zm">${u.zoom}</span></button>` +
    `<div class="pft"><span>${u.like(12 + p.cap[0].length % 40)}</span><span>${u.cm(2 + p.cap[0].length % 9)}</span></div></div>`;
  const src = checked ? `<div class="src"><b>${u.srcHd}</b><br>${esc(T(p.src))}</div>` : '';
  if (stage === 'spot') $('#side').innerHTML = `<div class="step">${u.st1}</div><div class="hint">${esc(u.spotHint)}</div>` +
    `<div class="acts"><button id="aZoom">${u.zoomBtn}</button><button id="aNone">${u.none}</button></div>`;
  else if (stage === 'decide') $('#side').innerHTML = `<div class="mine">${pt === 'none' ? u.mineNone : u.mineSpot}<button id="reSpot">${u.change}</button></div>` +
    `<div class="step">${u.st2}</div>` + src + `<div class="q">${checked ? u.q2 : u.q}</div><div class="acts">` +
    (checked ? `<button id="aShare2" data-a="share">${u.share}</button><button id="aSkip2" data-a="skip">${u.skip}</button>`
             : `<button id="aShare" data-a="share">${u.share}</button><button id="aCheck" data-a="check">${u.check}</button><button id="aSkip" data-a="skip">${u.skip}</button>`) + '</div>';
  else {
    const k = last, f = u.fb[k], chat = k === 'r' ? u.chatR : k === 'n' || k === 't' || k === 'gEither' ? [] : p.ok ? u.chatG : u.chatS, done = cur >= deck.length - 1 || (chief && hearts <= 0);
    $('#side').innerHTML = src + `<div class="fb ${k[0]}"><h3>${f[0]}</h3><p>${f[1]}</p><p class="clue">${u.aiNote[p.ai ? 0 : 1]} · ${u.clue}${esc(T(p.clue))}</p><p class="found">${clues[cur] ? u.found : p.spot ? u.missSpot : u.missNone}</p></div>` +
      `<div class="chat">${chat.map((m, i) => `<div class="msg" style="animation-delay:${.3 + i * .5}s"><b>${esc(m[0])}</b>${esc(m[1])}</div>`).join('')}</div>` +
      `<button id="nextP">${done ? u.last : u.next}</button>`;
  }
  paintTrail();
}
$('#side').addEventListener('click', e => {
  if (e.target.id === 'nextP') { if (cur < deck.length - 1 && !(chief && hearts <= 0)) { cur++; deal(); } else end(); return; }
  if (e.target.id === 'aZoom' || e.target.id === 'reSpot') return openZoom(true);
  if (e.target.id === 'aNone') { pt = 'none'; stage = 'decide'; paint(); return; }
  const b = e.target.closest('[data-a]'); if (!b || stage !== 'decide') return;
  const p = deck[cur], a = b.dataset.a;
  if (a === 'check') { checked = true; paint(); return; }
  // ผล: แชร์โพสต์หลอก = r · ไม่แชร์โพสต์ดี = n · ที่เหลือ = g (แยกข้อความตามที่ทำ)
  last = a === 'share' ? (p.ok ? 'gShare' : 'r') : p.either ? 'gEither' : p.ok ? 'n' : checked ? 'gCheck' : 'gSkip';
  marks[cur] = last[0]; clues[cur] = hit(p, pt); stopTimer(); if (chief && last === 'r') hearts--; stage = 'fb'; paint();
});
// ซูม: ขั้นหาเบาะแส/ตัดสินใจ = แตะในภาพเพื่อเลือกจุด (ยังไม่บอกว่าถูกไหม) · หลังตัดสินใจ = ดูกรอบเฉลย
function openZoom(pick){
  const z = $('#zoom'); z.classList.toggle('pick', pick);
  z.innerHTML = `<div class="zb">${marked(deck[cur])}</div><span>${pick ? U().zpick : U().zclose}</span>`; z.classList.remove('hide');
}
$('#feed').addEventListener('click', e => { if (e.target.closest('#pic')) openZoom(stage !== 'fb'); });
$('#zoom').onclick = e => {
  const z = $('#zoom'), svg = e.target.closest && e.target.closest('#zoom svg');
  if (z.classList.contains('pick') && svg) {
    const q = svg.createSVGPoint(); q.x = e.clientX; q.y = e.clientY;
    const v = q.matrixTransform(svg.getScreenCTM().inverse());
    pt = { x: Math.round(v.x), y: Math.round(v.y) }; if (stage === 'spot') stage = 'decide'; paint();
  }
  z.classList.add('hide');
};
function end(){
  stage = 'end'; show('sEnd');
  stopTimer();
  const g = marks.filter(m => m === 'g').length, n = deck.length, k = g + clues.filter(Boolean).length, r = k === 2 * n ? 2 : k >= n * 1.2 ? 1 : 0;
  const c = clues.filter(Boolean).length, out = chief && hearts <= 0;
  $('#eBadge').textContent = out ? '💔' : chief && r === 2 ? '👑' : ['🐣', '🔎', '🏅'][r];
  $('#eRank').textContent = out ? U().over : chief && r === 2 ? U().chief : U().ranks[r];
  // ปลดล็อกโหมดหัวหน้านักสืบ: 🏅 ในโหมดท้าทาย (ภาพชุดใหม่ 8 ภาพ)
  const unlock = !chief && !chiefOn && r === 2 && mode === 'ch';
  if (unlock) { chiefOn = true; try { localStorage.setItem(CKEY, '1'); } catch (e) {} }
  $('#eSum').innerHTML = (out ? esc(U().overSub) + '<br>' : '') + esc(U().sum(g, marks.filter(Boolean).length)) + '<br>' + esc(U().sum2(c, marks.filter(Boolean).length)) +
    (chief && !out ? '<br>' + esc(U().hearts) + ' ' + '❤️'.repeat(hearts) : '') + (unlock ? `<br><b>${esc(U().unlocked)}</b>` : '');
  $('#ePath').innerHTML = deck.filter((p, i) => marks[i]).map((p, i) => `<div><i>${marks[i] === 'g' ? '✅' : marks[i] === 'r' ? '⚠️' : marks[i] === 't' ? '⏰' : '➖'}${clues[i] ? '⭐' : ''}</i><span>${p.ai ? '🤖' : '📷'} ${esc(T(p.cap)).slice(0, 60)}</span></div>`).join('');
  $('#eAgain').textContent = U().again; $('#eTitle').textContent = U().toTitle; paintTrail();
}
let mode = 8;
$('#goE').onclick = () => start(mode = 8); $('#goH').onclick = () => start(mode = 'ch');
$('#goX').onclick = () => { if (chiefOn) { mode = 'X'; start(16, true); } };
$('#eAgain').onclick = () => mode === 'X' ? start(16, true) : start(mode);
function toTitle(){ seq++; stopTimer(); stage = 'title'; paintX(); show('sTitle'); $('#trail').classList.add('hide'); $('#zoom').classList.add('hide'); }
$('#eTitle').onclick = toTitle;
function paintX(){ $('#goX').innerHTML = U().goX(chiefOn); $('#goX').disabled = !chiefOn; }
function applyLang(){
  document.documentElement.lang = L; document.title = U().title;
  $('#lth').classList.toggle('on', L === 'th'); $('#len').classList.toggle('on', L === 'en');
  $('#tTitle').textContent = U().title; $('#tSub').textContent = U().sub; $('#goE').innerHTML = U().goE; $('#goH').innerHTML = U().goH; paintX(); $('#gback').textContent = U().gback; $('#home').textContent = U().home;
  if (stage === 'spot' || stage === 'decide' || stage === 'fb') paint(); else if (stage === 'end') end();
}
$('#home').onclick = () => toTitle();
$('#lth').onclick = () => { L = 'th'; applyLang(); }; $('#len').onclick = () => { L = 'en'; applyLang(); };
// เปิดใน iframe (Hub/ใบงาน): ปุ่มกลับส่ง 'closeGame' · รับภาษาจาก postMessage({lang})
if (window.parent !== window) { $('#gback').classList.remove('hide'); $('#gback').onclick = () => { toTitle(); parent.postMessage('closeGame', '*'); }; }
addEventListener('message', e => { if (e.data && e.data.lang) { L = e.data.lang === 'en' ? 'en' : 'th'; applyLang(); } });
applyLang();
</script>
</body></html>
