<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>คลังกิจกรรม</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:Kanit,Tahoma,sans-serif}
a{color:#fde68a}a:hover{color:#fff}
</style>
</helmet>
<div style="min-height: 800px; background: #0b2545; color: #ffffff; font-family: Kanit, Tahoma, sans-serif; padding: 24px 24px 40px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 22px">

  <div style="width: 100%; max-width: 1180px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 14px">
    <div style="display: flex; align-items: center; gap: 14px">
      <span style="width: 60px; height: 60px; border-radius: 50%; background: #4f46e5; display: flex; align-items: center; justify-content: center; font-size: 30px; font-weight: 800; border: 3px solid #ffffff">ข</span>
      <div style="display: flex; flex-direction: column">
        <span style="font-size: 30px; font-weight: 800; line-height: 1.1">สวัสดี ขิม!</span>
        <span style="font-size: 17px; color: #bfdbfe">Y3.2 · <a href="Names.dc.html">ไม่ใช่เรา? เปลี่ยนชื่อ</a> · <a href="Main.dc.html">หน้าแรก</a></span>
      </div>
    </div>
    <div style="display: flex; align-items: center; gap: 12px; background: #13315c; border-radius: 40px; padding: 8px 20px">
      <span style="font-size: 18px; color: #bfdbfe">ใบงานที่ส่งแล้ว</span>
      <div style="width: 160px; height: 14px; border-radius: 10px; background: #0b2545; overflow: hidden"><div style="width: 50%; height: 100%; background: #22c55e"></div></div>
      <span style="font-size: 22px; font-weight: 800">1/2</span>
    </div>
  </div>

  <div style="width: 100%; max-width: 1180px; display: flex; gap: 10px; flex-wrap: wrap" role="tablist">
    <sc-for list="{{tabs}}" as="tb" hint-placeholder-count="3">
      <button role="tab" aria-selected="{{tb.sel}}" onClick="{{tb.pick}}" style="font-family: inherit; font-size: 24px; font-weight: 600; min-height: 52px; padding: 6px 26px; border-radius: 16px; border: none; cursor: pointer; display: flex; align-items: center; gap: 10px; {{tb.style}}">{{tb.label}}<span style="font-size: 16px; font-weight: 400; opacity: .8">{{tb.count}}</span></button>
    </sc-for>
  </div>

  <div style="width: 100%; max-width: 1180px; display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px">
    <sc-for list="{{cards}}" as="c" hint-placeholder-count="4">
      <div style="border-radius: 24px; background: #ffffff; color: #0f172a; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 8px 0 #475569; {{c.dim}}">
        <div style="height: 130px; display: flex; align-items: center; justify-content: center; position: relative; background: {{c.art}}">
          <sc-if value="{{c.isSheet}}" hint-placeholder-val="{{true}}">
            <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"></path><path d="M14 3v5h5M9 13l2 2 4-4"></path></svg>
          </sc-if>
          <sc-if value="{{c.isGame}}" hint-placeholder-val="{{false}}">
            <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="6" width="20" height="12" rx="6"></rect><path d="M7 10v4M5 12h4"></path><circle cx="16" cy="11" r="1"></circle><circle cx="18" cy="13" r="1"></circle></svg>
          </sc-if>
          <sc-if value="{{c.isType}}" hint-placeholder-val="{{false}}">
            <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="6" width="20" height="12" rx="2"></rect><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M7 14h10"></path></svg>
          </sc-if>
          <span style="position: absolute; left: 14px; top: 12px; background: #00000040; border-radius: 12px; padding: 2px 12px; font-size: 16px; color: #ffffff">{{c.tag}}</span>
        </div>
        <div style="padding: 14px 18px 18px; display: flex; flex-direction: column; gap: 10px; flex: 1">
          <div style="font-size: 23px; font-weight: 600; line-height: 1.2">{{c.title}}</div>
          <span style="align-self: flex-start; border-radius: 20px; padding: 2px 12px; font-size: 16px; font-weight: 600; {{c.chipStyle}}">{{c.chip}}</span>
          <div style="flex: 1"></div>
          <sc-if value="{{c.open}}" hint-placeholder-val="{{true}}">
            <a href="{{c.href}}" style="display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; border-radius: 14px; font-size: 21px; font-weight: 600; text-decoration: none; color: #ffffff; background: {{c.btnBg}}">{{c.btn}}</a>
          </sc-if>
          <sc-if value="{{c.locked}}" hint-placeholder-val="{{false}}">
            <div style="display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; border-radius: 14px; font-size: 19px; color: #475569; background: #e2e8f0">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>
              ครูยังไม่เปิด
            </div>
          </sc-if>
        </div>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { tab: 'sheet' }; }
  renderVals() {
    const tab = this.state.tab;
    const st = {
      done: ['ส่งแล้ว ✓', 'background:#dcfce7;color:#166534', 'ดูผล / แก้ใหม่', '#0284c7'],
      doing: ['ทำค้างไว้', 'background:#fef3c7;color:#92400e', 'ทำต่อ', '#0284c7'],
      todo: ['ยังไม่เริ่ม', 'background:#e2e8f0;color:#334155', 'เริ่มทำ', '#0284c7'],
      lock: ['ล็อกอยู่', 'background:#f1f5f9;color:#475569', '', '#64748b'],
      play: ['เล่นได้เลย', 'background:#e2e8f0;color:#334155', 'เล่น', '#15803d'],
      ext: ['เปิดแอปใหม่', 'background:#e0f2fe;color:#075985', 'ไปฝึกพิมพ์', '#0369a1'],
    };
    const all = {
      sheet: [
        { tag: 'สัปดาห์ 1', title: 'กดได้ หรือหยุดถามผู้ใหญ่?', s: 'done', art: '#0284c7', href: 'Worksheet.dc.html' },
        { tag: 'สัปดาห์ 2', title: 'ใครถามข้อมูลส่วนตัว?', s: 'doing', art: '#0284c7', href: 'Worksheet.dc.html' },
        { tag: 'สัปดาห์ 3', title: '[ชื่อใบงานสัปดาห์ 3]', s: 'lock', art: '#94a3b8' },
        { tag: 'สัปดาห์ 4', title: '[ชื่อใบงานสัปดาห์ 4]', s: 'lock', art: '#94a3b8' },
      ],
      game: [
        { tag: 'ป๊อปอัปหลอก', title: 'ผจญภัยป่ามหัศจรรย์', s: 'play', art: '#15803d', href: 'Home.dc.html' },
        { tag: 'ป๊อปอัปหลอก', title: 'ปิดป๊อปอัปให้ทัน 60 วินาที', s: 'play', art: '#166534', href: 'Home.dc.html' },
        { tag: 'เร็ว ๆ นี้', title: '[เกมสัปดาห์ถัดไป]', s: 'lock', art: '#94a3b8' },
      ],
      type: [
        { tag: 'Thai Typing', title: 'คีย์บอร์ดเควส', s: 'ext', art: '#0369a1', href: 'Home.dc.html' },
      ],
    };
    const labels = { sheet: 'ใบงาน', game: 'เกม' };
    const tabs = Object.keys(labels).map(k => ({
      label: labels[k], count: String(all[k].length), sel: k === tab ? 'true' : 'false',
      style: k === tab ? 'background:#facc15;color:#0b2545' : 'background:#13315c;color:#ffffff',
      pick: () => this.setState({ tab: k }),
    }));
    const cards = all[tab].map(c => {
      const s = st[c.s], locked = c.s === 'lock';
      return { ...c, isSheet: tab === 'sheet', isGame: tab === 'game', isType: tab === 'type',
        chip: s[0], chipStyle: s[1], btn: s[2], btnBg: s[3], open: !locked, locked,
        dim: locked ? 'opacity:.75' : '' };
    });
    return { tabs, cards };
  }
}
</script>
</body>
</html>
