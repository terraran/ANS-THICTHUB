<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>เลือกห้อง</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:Kanit,Tahoma,sans-serif}
a{color:#fde68a}a:hover{color:#fff}
</style>
</helmet>
<div style="min-height: 800px; background: #0b2545; color: #ffffff; font-family: Kanit, Tahoma, sans-serif; display: flex; flex-direction: column; align-items: center; padding: 28px 24px 40px; box-sizing: border-box; gap: 30px">
  <div style="width: 100%; max-width: 1080px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px">
    <a href="Main.dc.html" style="display: flex; align-items: center; gap: 6px; min-height: 44px; font-size: 20px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
      หน้าแรก
    </a>
    <span style="background: #facc15; color: #0b2545; border-radius: 14px; padding: 2px 16px; font-size: 20px; font-weight: 800">THAI ICT</span>
  </div>
  <h1 style="margin: 0; font-size: 48px; font-weight: 800; text-align: center">เราเรียนห้องไหน?</h1>

  <div style="width: 100%; max-width: 1080px; display: flex; flex-direction: column; gap: 28px">
    <sc-for list="{{levels}}" as="lv" hint-placeholder-count="2">
      <div style="display: flex; flex-direction: column; gap: 12px">
        <div style="font-size: 22px; font-weight: 600; color: {{lv.label}}">{{lv.name}}</div>
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px">
          <sc-for list="{{lv.rooms}}" as="r" hint-placeholder-count="4">
            <a href="Names.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; height: 130px; border-radius: 22px; color: #ffffff; text-decoration: none; font-size: 44px; font-weight: 800; background: {{lv.bg}}; box-shadow: 0 8px 0 {{lv.shadow}}">{{r.name}}<span style="font-size: 17px; font-weight: 400">{{r.count}}</span></a>
          </sc-for>
        </div>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    const mk = (lvl, counts) => counts.map((c, i) => ({ name: lvl + '.' + (i + 1), count: c + ' คน' }));
    return { levels: [
      { name: 'ประถมศึกษาปีที่ 3', label: '#7dd3fc', bg: '#0284c7', shadow: '#075985', rooms: mk('Y3', [28, 27, 28, 26]) },
      { name: 'ประถมศึกษาปีที่ 4', label: '#c4b5fd', bg: '#4f46e5', shadow: '#312e81', rooms: mk('Y4', [29, 28, 27, 28]) },
    ] };
  }
}
</script>
</body>
</html>
